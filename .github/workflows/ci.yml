name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    # Inside a base image pinned by digest, not on the runner image itself. GitHub updates
    # `ubuntu-24.04` about weekly and it cannot be pinned, so its packages move under a run
    # that has not changed; this image does not. It is also the image `scripts/ci-local.sh`
    # builds from -- it reads the digest from this line -- so a local run and this job start
    # from the same bytes.
    container:
      image: ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
    defaults:
      run:
        shell: bash
    steps:
      # The image has no git yet, so checkout fetches the tree without history. Nothing in
      # the checks reads this repository's history; tests build their own repositories.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system packages
        run: scripts/ci-deps.sh

      # Installs the uv version pinned by `required-version` in pyproject.toml.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      # Each check is defined once, in scripts/ci.sh; these steps only name them, so the
      # job and `scripts/ci-local.sh` cannot run different commands.
      - name: Sync dependencies
        run: scripts/ci.sh sync
      - name: Format
        run: scripts/ci.sh format
      - name: Lint
        run: scripts/ci.sh lint
      - name: Type check (mypy)
        run: scripts/ci.sh mypy
      - name: Type check (pyright)
        run: scripts/ci.sh pyright
      - name: Tests
        run: scripts/ci.sh test
      - name: Verify toolchain discovery on a foreign host
        run: scripts/ci.sh doctor
      - name: Guard must reject a truncating libclang
        run: scripts/ci.sh guard
