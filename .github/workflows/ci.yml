name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Rich renders to whatever it thinks the terminal is; in CI that means escape codes in
  # the log and an 80-column wrap that mangles long cache paths.
  NO_COLOR: "1"
  COLUMNS: "160"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The tool refuses to run without a libclang that can reach the compiler's builtin
      # headers, so CI has to install the -dev package that carries them. Installing only
      # libclang1-18 reproduces the silent-truncation bug this project exists to avoid.
      - name: Install LLVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libclang1-18 libclang-common-18-dev llvm-18

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q

      # Worth its own step on a machine that is not a developer's. Library discovery is
      # the code most likely to be accidentally tuned to one host, and this is the only
      # place it gets exercised somewhere else: different LLVM packaging, no
      # /usr/lib/llvm-*/lib symlink farm, ldconfig as the only route to the library.
      - name: Verify toolchain discovery on a foreign host
        run: uv run cppsd doctor

      # A libclang without builtin headers returns a truncated AST and raises nothing.
      # The guard against that is the most load-bearing check in the project, so prove it
      # fires rather than trusting that it would.
      #
      # Aimed at the wheel's bundled library specifically, rather than at an apt install
      # with the -dev package withheld: the runner image already ships a complete LLVM, so
      # withholding a package proves nothing. The wheel computes its resource directory
      # relative to its own location in site-packages, so it fails regardless of what is
      # installed system-wide -- which is exactly the bug this reproduces.
      - name: Guard must reject a truncating libclang
        run: |
          set -uo pipefail
          wheel=$(uv run python -c \
            "import clang, pathlib; print(pathlib.Path(clang.__file__).parent / 'native' / 'libclang.so')")
          if [ ! -f "$wheel" ]; then
            echo "::notice::no bundled libclang at $wheel; nothing to guard against"
            exit 0
          fi
          if CPPSD_LIBCLANG="$wheel" uv run cppsd doctor; then
            echo "::error::doctor accepted a libclang that cannot parse stddef.h."
            echo "::error::That is the silent-truncation failure mode -- models would be"
            echo "::error::built from partial ASTs, agree with each other, and be wrong."
            exit 1
          fi
          echo "doctor correctly refused the truncating toolchain."
