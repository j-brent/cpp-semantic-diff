[project]
name = "cpp-semantic-diff"
version = "0.0.1"
description = "Meaningful diffs for C++ code review"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Brent Runyan" }]

dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
    "rich>=13.7",
    "networkx>=3.3",
    "libclang>=18.1",
]

[project.scripts]
cppsd = "cpp_semantic_diff.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpp_semantic_diff"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fixtures: requires the C++ fixture repos in C:/dev/cpp-demo-repos",
]
