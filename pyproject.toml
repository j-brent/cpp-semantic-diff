[project]
name = "cpp-semantic-diff"
version = "0.0.1"
description = "Meaningful diffs for C++ code review"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Brent Runyan" }]

dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
    "rich>=13.7",
    "networkx>=3.3",
    # For the `clang.cindex` Python bindings only. The native libclang.so this wheel
    # bundles is deliberately NOT used: it ships without the compiler's builtin headers,
    # so it returns truncated ASTs without raising. produce/toolchain.py loads a system
    # libclang instead and proves it can parse stddef.h before trusting it.
    "libclang>=18.1",
]

[project.scripts]
cppsd = "cpp_semantic_diff.cli:app"

[tool.uv]
# Exact, so CI (setup-uv reads this), the local CI image (scripts/ci-local.sh reads it) and
# every developer resolve and lock with the same uv. Raising it is a deliberate change.
required-version = "==0.10.2"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pyright>=1.1.414",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpp_semantic_diff"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Frozen documents are never edited, and that includes their scripts: a formatter run over the
# repository must not rewrite the evidence a report was produced with.
extend-exclude = ["reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fixtures: requires the C++ fixture repos ($CPPSD_FIXTURE_ROOT, default ~/fixtures)",
]

[tool.mypy]
python_version = "3.12"
files = ["src/cpp_semantic_diff", "tests"]
# Tests import `conftest` as a top-level module, the way pytest's rootdir importer loads it.
mypy_path = ["tests"]
plugins = ["pydantic.mypy"]
strict = true

# libclang's bindings ship no type information (no py.typed, no stubs).
[[tool.mypy.overrides]]
module = ["clang", "clang.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
# Check model construction against the declared field types, not Any.
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pyright]
include = ["src/cpp_semantic_diff", "tests"]
# Tests import `conftest` as a top-level module, the way pytest's rootdir importer loads it.
extraPaths = ["tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# Holds the stub that declares libclang's bindings untyped; see typings/clang/cindex.pyi.
stubPath = "typings"
